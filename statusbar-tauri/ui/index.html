<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenClaude Launch</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        background: #1e1e1e;
        color: #eee;
      }
      label {
        display: block;
        font-size: 12px;
        margin-top: 10px;
        margin-bottom: 4px;
        color: #aaa;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #2b2b2b;
        color: #eee;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        padding: 6px 14px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #333;
        color: #eee;
        cursor: pointer;
      }
      button[type="submit"] {
        background: #2d6cdf;
        border-color: #2d6cdf;
      }
      #error {
        color: #ff6b6b;
        font-size: 12px;
        margin-top: 8px;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <form id="launch-form">
      <label for="workspace">Workspace</label>
      <input id="workspace" list="workspace-list" placeholder="~/projects/my-project" autocomplete="off" />
      <datalist id="workspace-list"></datalist>

      <label for="provider">Provider</label>
      <select id="provider"></select>

      <label for="model">Model</label>
      <input id="model" list="model-list" placeholder="e.g. DeepSeek-V4-Pro" autocomplete="off" />
      <datalist id="model-list"></datalist>

      <div id="error"></div>

      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit">Launch</button>
      </div>
    </form>
    <script src="main.js"></script>
  </body>
</html>
